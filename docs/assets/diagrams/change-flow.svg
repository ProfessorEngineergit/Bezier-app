<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d"><title id="t">The path of one change</title><desc id="d">An edit is written to the journal first, then applied, rebuilt in a worker, and drawn.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9a9aa2"/></marker></defs><rect width="1200" height="400" rx="18" fill="#131315"/><text x="40" y="52" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#ececee">The path of one change</text><text x="40" y="80" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#9a9aa2">A fillet radius typed into the gizmo, from the key press to the picture. Record, then apply.</text><rect x="40" y="130" width="200" height="100" rx="12" fill="#26262b" stroke="#e8e8ea" stroke-width="1.5"/><text x="140.0" y="171.0" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#e8e8ea">1 · Journal</text><text x="140.0" y="193.0" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9a9aa2">append one line,</text><text x="140.0" y="210.0" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9a9aa2">wait until it is on disk</text><rect x="270" y="130" width="200" height="100" rx="12" fill="#1c1c1f" stroke="#3a3a3f" stroke-width="1.5"/><text x="370.0" y="171.0" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#ececee">2 · Apply</text><text x="370.0" y="193.0" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9a9aa2">to the document</text><text x="370.0" y="210.0" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9a9aa2">in memory</text><rect x="500" y="130" width="200" height="100" rx="12" fill="#1c1c1f" stroke="#3a3a3f" stroke-width="1.5"/><text x="600.0" y="171.0" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#ececee">3 · Rebuild</text><text x="600.0" y="193.0" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9a9aa2">only the changed feature</text><text x="600.0" y="210.0" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9a9aa2">and what depends on it</text><rect x="730" y="130" width="200" height="100" rx="12" fill="#1c1c1f" stroke="#3a3a3f" stroke-width="1.5"/><text x="830.0" y="171.0" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#ececee">4 · Geometry worker</text><text x="830.0" y="193.0" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9a9aa2">OCCT in WebAssembly;</text><text x="830.0" y="210.0" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9a9aa2">reports the faces it changed</text><rect x="960" y="130" width="200" height="100" rx="12" fill="#1c1c1f" stroke="#3a3a3f" stroke-width="1.5"/><text x="1060.0" y="171.0" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#ececee">5 · Viewport</text><text x="1060.0" y="193.0" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9a9aa2">typed arrays, moved not</text><text x="1060.0" y="210.0" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9a9aa2">copied; drawn when needed</text><line x1="240" y1="180" x2="270" y2="180" stroke="#9a9aa2" stroke-width="1.8" marker-end="url(#a)"/><line x1="470" y1="180" x2="500" y2="180" stroke="#9a9aa2" stroke-width="1.8" marker-end="url(#a)"/><line x1="700" y1="180" x2="730" y2="180" stroke="#9a9aa2" stroke-width="1.8" marker-end="url(#a)"/><line x1="930" y1="180" x2="960" y2="180" stroke="#9a9aa2" stroke-width="1.8" marker-end="url(#a)"/><text x="40" y="290" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#ececee">Measured for the first solid of a project (Chromium, 2026-10-02):</text><circle cx="46" cy="322" r="5" fill="#e8e8ea"/><text x="58" y="327" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#ececee">the change 100 ms</text><circle cx="261" cy="322" r="5" fill="#6cc7e0"/><text x="273" y="327" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#ececee">rebuild 78 ms</text><circle cx="476" cy="322" r="5" fill="#9a9aa2"/><text x="488" y="327" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#ececee">write 13 ms</text><circle cx="691" cy="322" r="5" fill="#9a9aa2"/><text x="703" y="327" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#ececee">history 7 ms</text><circle cx="906" cy="322" r="5" fill="#9a9aa2"/><text x="918" y="327" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#ececee">display 2 ms</text><text x="40" y="366" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#9a9aa2">A crash between 1 and 2 costs at most that one edit: the next open replays the line.</text></svg>