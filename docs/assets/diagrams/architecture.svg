<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d"><title id="t">Bezier architecture: five layers, each knowing only the one below</title><desc id="d">apps/studio over ui over renderer over core, which sits on kernel (Open CASCADE) and solver (planegcs)</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9a9aa2"/></marker></defs><rect width="1200" height="640" rx="18" fill="#131315"/><text x="40" y="52" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#ececee">Five layers. Each one may only know about the layer below it.</text><text x="40" y="80" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#9a9aa2">Enforced by lint, not by good intentions (biome.json, noRestrictedImports).</text><rect x="40" y="110" width="640" height="62" rx="12" fill="#1c1c1f" stroke="#3a3a3f" stroke-width="1.5"/><text x="360.0" y="132.0" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#ececee">apps/studio</text><text x="360.0" y="154.0" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9a9aa2">the app shell: layout, documents, the session</text><rect x="40" y="190" width="640" height="62" rx="12" fill="#1c1c1f" stroke="#3a3a3f" stroke-width="1.5"/><text x="360.0" y="212.0" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#ececee">@bezier/ui</text><text x="360.0" y="234.0" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9a9aa2">React: panels, gizmos, sketch tools, the shell</text><rect x="40" y="270" width="640" height="62" rx="12" fill="#1c1c1f" stroke="#3a3a3f" stroke-width="1.5"/><text x="360.0" y="292.0" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#ececee">@bezier/renderer</text><text x="360.0" y="314.0" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9a9aa2">Three.js viewport: drawing, edges, picking</text><rect x="40" y="350" width="640" height="84" rx="12" fill="#26262b" stroke="#e8e8ea" stroke-width="1.5"/><text x="360.0" y="383.0" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#e8e8ea">@bezier/core</text><text x="360.0" y="405.0" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9a9aa2">the parametric layer: feature history, rebuild,</text><text x="360.0" y="422.0" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9a9aa2">stable geometry references</text><rect x="40" y="470" width="310" height="70" rx="12" fill="#1c1c1f" stroke="#3a3a3f" stroke-width="1.5"/><text x="195.0" y="496.0" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#ececee">@bezier/kernel</text><text x="195.0" y="518.0" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9a9aa2">Open CASCADE → WebAssembly,</text><text x="195.0" y="535.0" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9a9aa2">in a supervised worker</text><rect x="370" y="470" width="310" height="70" rx="12" fill="#1c1c1f" stroke="#3a3a3f" stroke-width="1.5"/><text x="525.0" y="496.0" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#ececee">@bezier/solver</text><text x="525.0" y="518.0" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9a9aa2">planegcs, the 2D constraint solver</text><text x="525.0" y="535.0" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9a9aa2">(a stand-in today)</text><line x1="360.0" y1="172" x2="360.0" y2="190" stroke="#9a9aa2" stroke-width="1.8" marker-end="url(#a)"/><line x1="360.0" y1="252" x2="360.0" y2="270" stroke="#9a9aa2" stroke-width="1.8" marker-end="url(#a)"/><line x1="360.0" y1="332" x2="360.0" y2="350" stroke="#9a9aa2" stroke-width="1.8" marker-end="url(#a)"/><line x1="195" y1="434" x2="195" y2="470" stroke="#9a9aa2" stroke-width="1.8" marker-end="url(#a)"/><line x1="525" y1="434" x2="525" y2="470" stroke="#9a9aa2" stroke-width="1.8" marker-end="url(#a)"/><rect x="115" y="560" width="160" height="44" rx="22" fill="#1c1c1f" stroke="#3a3a3f" stroke-width="1.5"/><text x="195.0" y="587.0" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#ececee">occt-wasm · LGPL</text><rect x="440" y="560" width="170" height="44" rx="22" fill="#1c1c1f" stroke="#3a3a3f" stroke-width="1.5"/><text x="525.0" y="587.0" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#ececee">planegcs · LGPL</text><line x1="195" y1="540" x2="195" y2="560" stroke="#9a9aa2" stroke-width="1.8" marker-end="url(#a)"/><line x1="525" y1="540" x2="525" y2="560" stroke="#9a9aa2" stroke-width="1.8" marker-end="url(#a)"/><text x="740" y="150" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#9a9aa2">What we reuse</text><text x="740" y="176" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#ececee">the geometry kernel (Open CASCADE),</text><text x="740" y="198" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#ececee">the 2D constraint solver (planegcs),</text><text x="740" y="220" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#ececee">the renderer (Three.js).</text><text x="740" y="276" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e8e8ea">What we build</text><text x="740" y="302" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#ececee">the feature history and rebuild,</text><text x="740" y="324" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#ececee">the stable geometry references,</text><text x="740" y="346" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#ececee">the whole interface.</text><text x="740" y="402" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e8e8ea">The hard part lives in core.</text><text x="740" y="428" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#ececee">After a rebuild, does the fillet still</text><text x="740" y="450" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#ececee">know which edge it was on?</text><text x="740" y="482" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#9a9aa2">Names by provenance, never by position.</text><text x="740" y="516" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#9a9aa2">Kernel failures are values (KernelResult),</text><text x="740" y="536" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#9a9aa2">never exceptions.</text></svg>