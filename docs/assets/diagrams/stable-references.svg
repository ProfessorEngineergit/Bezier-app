<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-labelledby="t d"><title id="t">Names that survive a rebuild</title><desc id="d">The kernel renumbers faces on every rebuild; Bezier names them by the feature that made them.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9a9aa2"/></marker></defs><rect width="1200" height="440" rx="18" fill="#131315"/><text x="40" y="52" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#ececee">Name geometry by what made it, not where it is</text><text x="40" y="80" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#9a9aa2">The kernel renumbers everything on every rebuild. Numbers cannot be the key; provenance can.</text><text x="40" y="128" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e0a96c">What the kernel says</text><rect x="40" y="146" width="250" height="74" rx="12" fill="#1c1c1f" stroke="#3a3a3f" stroke-width="1.5"/><text x="165.0" y="174.0" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#ececee">before: edge 7</text><text x="165.0" y="196.0" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9a9aa2">the edge you rounded</text><rect x="40" y="250" width="250" height="74" rx="12" fill="#1c1c1f" stroke="#e0a96c" stroke-width="1.5"/><text x="165.0" y="278.0" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#e0a96c">after the change: edge 7</text><text x="165.0" y="300.0" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9a9aa2">is somewhere else now</text><line x1="165" y1="220" x2="165" y2="250" stroke="#e0a96c" stroke-width="1.8" marker-end="url(#a)"/><text x="40" y="358" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9a9aa2">An identical rebuild keeps 0 of 6 face hashes.</text><text x="40" y="380" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9a9aa2">Widening a box leaves 1 of 6 faces unchanged.</text><text x="380" y="128" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#e8e8ea">What Bezier says</text><rect x="380" y="146" width="780" height="52" rx="12" fill="#26262b" stroke="#e8e8ea" stroke-width="1.5"/><text x="770.0" y="163.0" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="16" font-weight="600" fill="#e8e8ea">F:extrude-1:side-2</text><text x="770.0" y="185.0" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9a9aa2">a face: the feature that produced it, and a tag</text><rect x="380" y="216" width="780" height="52" rx="12" fill="#26262b" stroke="#e8e8ea" stroke-width="1.5"/><text x="770.0" y="233.0" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="16" font-weight="600" fill="#e8e8ea">E(F:extrude-1:end|F:extrude-1:side-2)</text><text x="770.0" y="255.0" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9a9aa2">an edge: the two faces it lies between</text><rect x="380" y="286" width="780" height="52" rx="12" fill="#26262b" stroke="#e8e8ea" stroke-width="1.5"/><text x="770.0" y="303.0" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="16" font-weight="600" fill="#e8e8ea">V(F:extrude-1:end|F:extrude-1:side-1|F:extrude-1:side-2)</text><text x="770.0" y="325.0" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9a9aa2">a vertex: the faces that meet at it</text><text x="380" y="372" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9a9aa2">Every operation reports which faces it modified, generated and deleted; following those reports</text><text x="380" y="392" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9a9aa2">from the first feature to the last carries a name from step 2 to step 4.</text><text x="380" y="420" text-anchor="start" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#ececee">The text form is written into saved files, so it is a compatibility promise.</text></svg>