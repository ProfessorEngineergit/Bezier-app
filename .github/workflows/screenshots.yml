name: Screenshots

# Screenshots for the README and docs, made the same way on each system:
#
#   tour    the app in Chromium in 11 fixed states (e2e/tour), without window chrome.
#           Playwright's WebKit renders the orientation cube incorrectly, so it is
#           not used.
#   window  the packaged app with native title bar and menus in four states
#           (scripts/drive-desktop-app.mjs).
#
# macOS screenshots are made locally (scripts/capture/mac-window.sh and the tour)
# because hosted macOS minutes cost ten times as much.
#
# Output is an artifact for review, not a commit.

on:
  workflow_dispatch:
    inputs:
      systems:
        description: Which system to photograph
        type: choice
        options: [all, linux, windows, windows-window, windows-tour]
        default: all

permissions:
  contents: read

jobs:
  plan:
    name: Which systems
    runs-on: ubuntu-latest
    outputs:
      tour: ${{ steps.pick.outputs.tour }}
    steps:
      - id: pick
        env:
          SYSTEMS: ${{ inputs.systems }}
        run: |
          items=""
          add() { items="${items:+$items,}$1"; }
          [ "$SYSTEMS" = all ] || [ "$SYSTEMS" = linux ] && add '{"name":"Linux","os":"ubuntu-22.04","engine":"chromium","shots":"linux"}'
          [ "$SYSTEMS" = all ] || [ "$SYSTEMS" = windows ] || [ "$SYSTEMS" = windows-tour ] && add '{"name":"Windows","os":"windows-latest","engine":"chromium","shots":"windows"}'
          echo "tour=[$items]" >> "$GITHUB_OUTPUT"

  tour:
    name: Tour, ${{ matrix.name }}
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.tour) }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install browser
        run: pnpm exec playwright install --with-deps ${{ matrix.engine }}
      - name: Tour
        shell: bash
        env:
          TOUR: '1'
          TOUR_ENGINE: ${{ matrix.engine }}
          SHOTS_DIR: tour-out
          SHOTS_OS: ${{ matrix.shots }}
          CI: '1'
        run: pnpm exec playwright test --project=tour --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tour-${{ matrix.shots }}
          path: tour-out/
          if-no-files-found: warn
          retention-days: 14

  window-linux:
    name: Window, Linux
    needs: plan
    if: inputs.systems == 'all' || inputs.systems == 'linux'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            imagemagick openbox dbus webkit2gtk-driver xvfb fonts-dejavu-core
      - uses: actions/cache@v4
        id: driver
        with:
          path: ~/.cargo/bin/tauri-driver
          key: tauri-driver-2.1.0-${{ runner.os }}
      - if: steps.driver.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --locked --version 2.1.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bezier/desktop exec tauri build --ci --no-bundle
      - name: Photograph the window
        run: |
          dbus-run-session -- xvfb-run -a -s "-screen 0 1440x900x24" bash -c '
            openbox > /dev/null 2>&1 &
            sleep 2
            tauri-driver > driver.log 2>&1 &
            sleep 3
            CAPTURE_DIR=window-out CAPTURE_CMD="import -window root {file}" \
              node scripts/drive-desktop-app.mjs "$0"
          ' "$PWD/apps/desktop/src-tauri/target/release/bezier-desktop"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: window-linux
          path: |
            window-out/
            driver.log
          if-no-files-found: warn
          retention-days: 14

  window-windows:
    name: Window, Windows
    needs: plan
    if: inputs.systems == 'all' || inputs.systems == 'windows' || inputs.systems == 'windows-window'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bezier/desktop exec tauri build --ci --no-bundle

      # Keyboard-driven like on macOS (scripts/capture/windows-window.ps1): Edge
      # WebDriver fails to start the app on runners ("DevToolsActivePort file
      # doesn't exist").
      - name: Photograph the window
        shell: pwsh
        run: pwsh scripts/capture/windows-window.ps1 -Exe (Resolve-Path apps/desktop/src-tauri/target/release/bezier-desktop.exe).Path -Out window-out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: window-windows
          path: window-out/
          if-no-files-found: warn
          retention-days: 14
