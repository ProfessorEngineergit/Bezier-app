# Bezier sync on a home server: the server, and Caddy in front for HTTPS.
#
#   cp deploy/.env.example deploy/.env      # then edit it
#   docker compose -f deploy/compose.yaml up -d
#
# The server itself is never published to the network; only Caddy is.
services:
  sync:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    # It only ever writes to its data directories, so nothing else in the container can change,
    # and nothing it runs can gain rights or start a swarm of processes.
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 1g
    volumes:
      - ${BEZIER_DATA_DIR:-./data}:/data
      # A second disk or a NAS mount as a replica. Remove if there is none.
      - ${BEZIER_REPLICA_DIR:-./replica}:/replica
    environment:
      BEZIER_SYNC_REPLICAS: /replica
      # Caddy sets X-Forwarded-For; the rate limit needs the real address.
      BEZIER_SYNC_TRUST_PROXY: "1"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/v1/health"]
      interval: 1m

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "443:443"
      - "80:80"
    environment:
      BEZIER_DOMAIN: ${BEZIER_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      # Parts for Bezier's library, if you offer any (README).
      - ${BEZIER_PARTS_DIR:-./parts}:/srv/parts:ro

  # Nightly check of every copy of every object, repairing from a good copy.
  scrub:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    profiles: ["maintenance"]
    env_file: .env
    environment:
      BEZIER_SYNC_REPLICAS: /replica
    volumes:
      - ${BEZIER_DATA_DIR:-./data}:/data
      - ${BEZIER_REPLICA_DIR:-./replica}:/replica
    command: ["node", "server/main.ts", "scrub"]

volumes:
  caddy-data:
